services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: munim
      POSTGRES_USER: munim
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-munim-local}
    ports: ["5432:5432"]
    volumes: [munim-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munim -d munim"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/munim
      DATABASE_USER: munim
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-munim-local}
      PORT: 8080
      MUNIM_AI_PROVIDER: ${MUNIM_AI_PROVIDER:-mock}
      MUNIM_AI_MODEL: ${MUNIM_AI_MODEL:-gpt-4o-mini}
      MUNIM_AI_API_KEY: ${MUNIM_AI_API_KEY:-}
      MUNIM_AI_BASE_URL: ${MUNIM_AI_BASE_URL:-https://api.openai.com/v1}
      MUNIM_ML_SERVICE_URL: ${MUNIM_ML_SERVICE_URL:-http://ml-service:8000}
      INTERNAL_ML_SECRET: ${INTERNAL_ML_SECRET:-munim-internal-ml-secret-dev}
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
  ml-service:
    build:
      context: ml
      dockerfile: Dockerfile
    environment:
      INTERNAL_ML_SECRET: ${INTERNAL_ML_SECRET:-munim-internal-ml-secret-dev}
      PORT: 8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: http://localhost:8080/api/v1
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  munim-postgres:
