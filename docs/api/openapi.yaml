      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DecisionCreate'}}}}
      responses:
        '200': {description: Decision recorded by ApprovalService, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /workflows/{workflowId}:
    parameters: [{$ref: '#/components/parameters/WorkflowId'}]
