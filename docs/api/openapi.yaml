      responses:
        '201': {description: Pending proposal, content: {application/json: {schema: {$ref: '#/components/schemas/Proposal'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /approvals:
    get:
      tags: [Approvals]
