        '404': {$ref: '#/components/responses/Problem'}
  /workflows/{workflowId}/retry:
    parameters: [{$ref: '#/components/parameters/WorkflowId'}]
    post:
      tags: [Workflows]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {stepId: {type: string, format: uuid}}, required: [stepId]}}}}
      responses:
        '202': {description: Retry accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Workflow'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /analytics/summary:
    get:
      tags: [Analytics]
      x-required-role: [OWNER, READ_ONLY_EVALUATOR]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Clearly labeled scenario statistics, content: {application/json: {schema: {type: object, properties: {counts: {type: object}, scenarioEstimates: {type: object}, synthetic: {type: boolean, const: true}}, required: [counts, scenarioEstimates, synthetic]}}}}
        '400': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    demoBearer: {type: http, scheme: bearer, bearerFormat: JWT, description: Local demo identity adapter; server authorization remains mandatory.}
  parameters:
    Active: {name: active, in: query, schema: {type: boolean}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
    RfqId: {name: rfqId, in: path, required: true, schema: {type: string, format: uuid}}
    QuoteId: {name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}
    Revision: {name: revision, in: path, required: true, schema: {type: integer, minimum: 1}}
    ClarificationId: {name: clarificationId, in: path, required: true, schema: {type: string, format: uuid}}
    EvaluationId: {name: evaluationId, in: path, required: true, schema: {type: string, format: uuid}}
    EnquiryId: {name: enquiryId, in: path, required: true, schema: {type: string, format: uuid}}
    CostSheetId: {name: costSheetId, in: path, required: true, schema: {type: string, format: uuid}}
    ApprovalId: {name: approvalId, in: path, required: true, schema: {type: string, format: uuid}}
    ProposalId: {name: proposalId, in: path, required: true, schema: {type: string, format: uuid}}
    WorkflowId: {name: workflowId, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Problem:
      description: RFC 9457-style error
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Decimal:
      type: string
      pattern: '^-?\d{1,10}(\.\d{1,4})?$'
      example: '95.0000'
      description: Decimal string, no exponent notation; rates/quantities have at most 4 decimals.
    Money:
      type: string
      pattern: '^-?\d{1,12}(\.\d{1,2})?$'
      example: '47500.00'
      description: INR monetary amount, exactly two fractional digits in responses.
    Problem:
      type: object
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        fieldErrors: {type: object, additionalProperties: {type: string}}
        traceId: {type: string, format: uuid}
      required: [type, title, status, code, traceId]
    Material: {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}, grade: {type: string}, specification: {type: string}, baseUnit: {type: string}, active: {type: boolean}}, required: [id, name, baseUnit, active]}
    Supplier: {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}, location: {type: string}, isSynthetic: {type: boolean}, active: {type: boolean}}, required: [id, name, isSynthetic, active]}
    SupplierCreate: {type: object, properties: {name: {type: string, minLength: 1}, location: {type: string}, isSynthetic: {type: boolean, const: true}}, required: [name, isSynthetic]}
    Completeness: {type: object, properties: {quoteRevisionId: {type: string, format: uuid}, complete: {type: boolean}, missingFields: {type: array, items: {type: string}}, warnings: {type: array, items: {type: string}}}, required: [quoteRevisionId, complete, missingFields, warnings]}
    OwnerPolicy:
      type: object
      properties:
        version: {type: integer}
        minimumMarginPercent: {$ref: '#/components/schemas/Decimal'}
        maximumPurchaseBudget: {$ref: '#/components/schemas/Money'}
        minimumUnitRate: {$ref: '#/components/schemas/Decimal'}
        maximumUnitRate: {$ref: '#/components/schemas/Decimal'}
        maximumDiscountPercent: {$ref: '#/components/schemas/Decimal'}
        maximumPaymentDays: {type: integer, minimum: 0}
        allowedNegotiableTerms: {type: array, items: {type: string}}
        sellerVisibleFields: {type: array, items: {type: string, enum: [material_specification, required_quantity, requested_delivery_date, proposed_unit_rate, payment_terms]}}
        forbiddenDisclosureFields: {type: array, items: {type: string, enum: [competitor_identity, competitor_quote, internal_target, internal_margin, owner_private_notes, other_supplier_terms]}}
      required: [version, minimumMarginPercent, maximumPurchaseBudget, minimumUnitRate, maximumUnitRate, maximumDiscountPercent, maximumPaymentDays, allowedNegotiableTerms, sellerVisibleFields, forbiddenDisclosureFields]
    OwnerPolicyUpdate: {type: object, properties: {expectedVersion: {type: integer}, policy: {$ref: '#/components/schemas/OwnerPolicy'}}, required: [expectedVersion, policy]}
    RfqCreate:
      type: object
      properties:
        materialId: {type: string, format: uuid}
        specification: {type: string, minLength: 1}
        quantity: {$ref: '#/components/schemas/Decimal'}
        unit: {type: string}
        customerRequiredBy: {type: [string, 'null'], format: date-time}
        productionLeadDays: {type: [integer, 'null'], minimum: 0}
        requiredProcurementDeliveryAt: {type: [string, 'null'], format: date-time}
        timezone: {type: string, example: Asia/Kolkata}
        allowSplitSourcing: {type: boolean, const: false}
      required: [materialId, specification, quantity, unit, timezone, allowSplitSourcing]
      description: Provide direct procurement deadline or customerRequiredBy plus productionLeadDays; conflicting combinations return 422.
    RfqPage: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Rfq'}}, total: {type: integer}}, required: [items, total]}
    Rfq: {type: object, properties: {id: {type: string, format: uuid}, materialId: {type: string, format: uuid}, quantity: {$ref: '#/components/schemas/Decimal'}, unit: {type: string}, productionLeadDays: {type: [integer, 'null']}, requiredProcurementDeliveryAt: {type: string, format: date-time}, referenceAt: {type: string, format: date-time}, timezone: {type: string}, status: {type: string}}, required: [id, materialId, quantity, unit, requiredProcurementDeliveryAt, referenceAt, timezone, status]}
    QuoteCreate:
      type: object
      properties:
        supplierId: {type: string, format: uuid}
        receivedAt: {type: string, format: date-time}
        rawMessage: {type: string, maxLength: 20000}
        manualFields: {$ref: '#/components/schemas/QuoteFields'}
      required: [supplierId, receivedAt, rawMessage, manualFields]
      description: receivedAt is supplier offer receipt time, not application ingestion time; demo supplier must be synthetic.
    QuoteFields:
      type: object
      properties:
        unitPrice: {$ref: '#/components/schemas/Decimal'}
        quotedQuantity: {$ref: '#/components/schemas/Decimal'}
        unit: {type: string}
        priceBasis: {type: string, enum: [EXCLUSIVE, INCLUSIVE, UNKNOWN]}
        materialTaxRate: {$ref: '#/components/schemas/Decimal'}
        materialItcStatus: {type: string, enum: [CREDITABLE, NON_CREDITABLE, UNKNOWN]}
        freightBasis: {type: string, enum: [SEPARATE, INCLUDED_IN_UNIT_PRICE, UNKNOWN]}
        freightAmount: {$ref: '#/components/schemas/Money'}
        freightTaxRate: {$ref: '#/components/schemas/Decimal'}
        freightPriceBasis: {type: string, enum: [EXCLUSIVE, INCLUSIVE, UNKNOWN]}
        freightItcStatus: {type: string, enum: [CREDITABLE, NON_CREDITABLE, UNKNOWN]}
        moq: {$ref: '#/components/schemas/Decimal'}
        purchaseIncrement: {$ref: '#/components/schemas/Decimal'}
        wastagePercent: {$ref: '#/components/schemas/Decimal'}
        quoteQuantityBasis: {type: string, enum: [INPUT_PURCHASED, USABLE_OUTPUT, UNKNOWN]}
        promisedDeliveryAt: {type: string, format: date-time}
        validFrom: {type: string, format: date-time}
        validUntil: {type: string, format: date-time}
      description: Omitted/null fields remain UNKNOWN and cause completeness to fail; they are never defaulted to zero.
    FieldValue: {type: object, properties: {value: {}, confidence: {type: [number, 'null'], minimum: 0, maximum: 1}, evidence: {type: [string, 'null']}, source: {type: string, enum: [EXTRACTED, MANUAL, SUPPLIER_RESPONSE, UNKNOWN]}}, required: [value, confidence, evidence, source]}
    QuoteRevision: {type: object, properties: {id: {type: string, format: uuid}, quoteId: {type: string, format: uuid}, revision: {type: integer}, state: {type: string, enum: [DRAFT, RECEIVED, EXTRACTED, NEEDS_REVIEW, VERIFIED, SUPERSEDED, WITHDRAWN]}, receivedAt: {type: string, format: date-time}, fields: {type: object, additionalProperties: {$ref: '#/components/schemas/FieldValue'}}, missingFields: {type: array, items: {type: string}}, version: {type: integer}}, required: [id, quoteId, revision, state, fields, missingFields, version]}
    ExtractionResult: {type: object, properties: {revisionId: {type: string, format: uuid}, candidates: {type: object, additionalProperties: {$ref: '#/components/schemas/FieldValue'}}, providerStatus: {type: string}, modelVersion: {type: string}, promptVersion: {type: string}}, required: [revisionId, candidates, providerStatus, modelVersion, promptVersion]}
    QuoteFieldCorrection: {type: object, properties: {expectedVersion: {type: integer}, fields: {type: object, additionalProperties: true}, correctionReason: {type: string, minLength: 1}}, required: [expectedVersion, fields, correctionReason]}
    ClarificationDraft: {type: object, properties: {id: {type: string, format: uuid}, draft: {type: string}, expectedFields: {type: array, items: {type: string}}, status: {type: string, const: DRAFT}}, required: [id, draft, expectedFields, status]}
    EvaluationCreate: {type: object, properties: {quoteRevisionIds: {type: array, minItems: 1, items: {type: string, format: uuid}}, policyVersion: {type: integer}}, required: [quoteRevisionIds, policyVersion], description: Server records referenceAt; clients cannot backdate evaluation.}
    Evaluation: {type: object, properties: {id: {type: string, format: uuid}, rfqId: {type: string, format: uuid}, referenceAt: {type: string, format: date-time}, calculationVersion: {type: string}, policyVersion: {type: integer}, status: {type: string, enum: [COMPLETE, INCOMPLETE]}, lines: {type: array, items: {$ref: '#/components/schemas/EvaluationLine'}}, snapshotHash: {type: string}}, required: [id, rfqId, referenceAt, calculationVersion, policyVersion, status, lines, snapshotHash]}
    EvaluationLine: {type: object, properties: {id: {type: string, format: uuid}, quoteRevisionId: {type: string, format: uuid}, eligible: {type: boolean}, reasonCodes: {type: array, items: {type: string}}, economicLandedCost: {type: [string, 'null']}, cashPayable: {type: [string, 'null']}, currency: {type: string, const: INR}}, required: [id, quoteRevisionId, eligible, reasonCodes, currency]}
    Comparison: {type: object, properties: {evaluationId: {type: string, format: uuid}, lines: {type: array, items: {$ref: '#/components/schemas/EvaluationLine'}}}, required: [evaluationId, lines]}
    NegotiationDraft: {type: object, properties: {draft: {type: string}, limits: {type: object, additionalProperties: true}, disclosureCheck: {type: string, enum: [PASS, BLOCKED]}, disclosures: {type: array, items: {type: string}}}, required: [draft, limits, disclosureCheck, disclosures]}
    AwardProposalCreate: {type: object, properties: {quoteRevisionId: {type: string, format: uuid}, expectedSnapshotHash: {type: string}}, required: [quoteRevisionId, expectedSnapshotHash]}
    Proposal: {type: object, properties: {id: {type: string, format: uuid}, type: {type: string, enum: [SUPPLIER_AWARD, CUSTOMER_QUOTE]}, status: {type: string, enum: [PENDING, APPROVED, REJECTED, STALE]}, snapshotHash: {type: string}, invalidatedAt: {type: [string, 'null'], format: date-time}}, required: [id, type, status, snapshotHash]}
    EnquiryCreate: {type: object, properties: {customerName: {type: string}, productDescription: {type: string}, quantity: {$ref: '#/components/schemas/Decimal'}, unit: {type: string}, requiredBy: {type: string, format: date-time}}, required: [productDescription, quantity, unit, requiredBy]}
    Enquiry: {type: object, properties: {id: {type: string, format: uuid}, status: {type: string}}, required: [id, status]}
    CostSheetCreate: {type: object, properties: {evaluationLineId: {type: [string, 'null'], format: uuid}, priceBasis: {type: string, enum: [AWARDED_QUOTE, EVALUATED_QUOTE, OWNER_OVERRIDE]}, materialCost: {type: [string, 'null'], pattern: '^\\d+(\\.\\d{1,2})?$'}, labourCost: {type: [string, 'null']}, overheadCost: {type: [string, 'null']}, freightCost: {type: [string, 'null']}, otherCosts: {type: array, items: {type: object, properties: {name: {type: string}, amount: {$ref: '#/components/schemas/Money'}}, required: [name, amount]}}, unknownFields: {type: array, items: {type: string}}}, required: [priceBasis, otherCosts, unknownFields]}
    CostSheet: {type: object, properties: {id: {type: string, format: uuid}, enquiryId: {type: string, format: uuid}, evaluationId: {type: [string, 'null'], format: uuid}, evaluationLineId: {type: [string, 'null'], format: uuid}, priceBasis: {type: string}, totalCost: {type: [string, 'null']}, version: {type: integer}, completeness: {type: string, enum: [COMPLETE, INCOMPLETE]}}, required: [id, enquiryId, priceBasis, version, completeness]}
    PriceSimulation: {type: object, properties: {totalCost: {$ref: '#/components/schemas/Money'}, sellingPrice: {$ref: '#/components/schemas/Money'}, profit: {$ref: '#/components/schemas/Money'}, marginPercent: {$ref: '#/components/schemas/Decimal'}, markupPercent: {$ref: '#/components/schemas/Decimal'}, warnings: {type: array, items: {type: string}}}, required: [totalCost, sellingPrice, profit, marginPercent, markupPercent, warnings]}
    CustomerProposalCreate: {type: object, properties: {expectedVersion: {type: integer}, sellingPrice: {$ref: '#/components/schemas/Money'}, validUntil: {type: string, format: date-time}}, required: [expectedVersion, sellingPrice, validUntil]}
    ApprovalQueueItem: {type: object, properties: {proposal: {$ref: '#/components/schemas/Proposal'}, createdAt: {type: string, format: date-time}, ownerActionRequired: {type: boolean}}, required: [proposal, createdAt, ownerActionRequired]}
    ApprovalPage: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/ApprovalQueueItem'}}, total: {type: integer}}, required: [items, total]}
    Approval: {type: object, properties: {id: {type: string, format: uuid}, proposalId: {type: string, format: uuid}, actorId: {type: string, format: uuid}, decision: {type: string, enum: [APPROVE, REJECT]}, snapshotHash: {type: string}, decidedAt: {type: string, format: date-time}}, required: [id, proposalId, actorId, decision, snapshotHash, decidedAt]}
    ApprovalDetail: {type: object, properties: {proposal: {$ref: '#/components/schemas/Proposal'}, decisions: {type: array, items: {$ref: '#/components/schemas/Approval'}}}, required: [proposal, decisions]}
    DecisionCreate: {type: object, properties: {decision: {type: string, enum: [APPROVE, REJECT]}, reason: {type: string}, expectedSnapshotHash: {type: string}}, required: [decision, reason, expectedSnapshotHash]}
    Workflow: {type: object, properties: {id: {type: string, format: uuid}, state: {type: string, enum: [CREATED, RUNNING, WAITING_FOR_INPUT, READY_FOR_EVALUATION, EVALUATED, AWAITING_APPROVAL, APPROVED, REJECTED, FAILED_RETRYABLE, FAILED_FINAL, STALE, CANCELLED]}, retryCount: {type: integer}, maxRetries: {type: integer}}, required: [id, state, retryCount, maxRetries]}
    WorkflowDetail: {type: object, properties: {run: {$ref: '#/components/schemas/Workflow'}, steps: {type: array, items: {type: object}}, events: {type: array, items: {type: object}}}, required: [run, steps, events]}
    CustomerEnquiryCreate:
