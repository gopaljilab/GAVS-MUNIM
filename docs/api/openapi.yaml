        materialId: {type: string, format: uuid}
        partName: {type: string}
        netQuantity: {$ref: '#/components/schemas/Decimal'}
        unit: {type: string}
        scrapPercentage: {$ref: '#/components/schemas/Decimal'}
        scrapRecoverySupported: {type: boolean}
        scrapRecoveryPrice: {$ref: '#/components/schemas/Decimal'}
        sourcingBasis: {type: string, enum: [AWARDED_QUOTE, ESTIMATE]}
        awardedQuoteRevisionId: {type: [string, 'null'], format: uuid}
        estimatedUnitCost: {$ref: '#/components/schemas/Decimal'}
