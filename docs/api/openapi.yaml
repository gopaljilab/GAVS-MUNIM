        - {name: status, in: query, schema: {type: string, enum: [PENDING, APPROVED, REJECTED, STALE]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {description: Read-only approval queue, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalPage'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
  /approvals/{proposalId}:
    parameters: [{$ref: '#/components/parameters/ProposalId'}]
    get:
      tags: [Approvals]
      x-required-role: [OWNER]
      responses:
        '200': {description: Approval detail, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalDetail'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /proposals/{proposalId}/decision:
    parameters: [{$ref: '#/components/parameters/ProposalId'}]
    post:
      tags: [Approvals]
      x-required-role: [OWNER]
