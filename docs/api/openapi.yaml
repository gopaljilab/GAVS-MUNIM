openapi: 3.1.0
info:
  title: MUNIM API
  version: 1.1.0
  description: >-
    Contract for the single-tenant sheet-metal procurement and profitability MVP.
    Monetary decimals are strings. LLM outputs are suggestions; approval state
    changes only through the authorized decision operation.
    All persisted POST commands require Idempotency-Key. Identical actor,
    operation, key, and canonical request replay the original response;
    same key with different content returns 409 IDEMPOTENCY_KEY_REUSED.
servers:
  - url: /api/v1
security:
  - demoBearer: []
tags:
  - {name: Reference}
  - {name: Procurement}
  - {name: Quotes}
  - {name: Evaluations}
  - {name: Profitability}
  - {name: Approvals}
  - {name: Workflows}
  - {name: Analytics}
paths:
  /materials:
    get:
      tags: [Reference]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      parameters: [{$ref: '#/components/parameters/Active'}]
      responses:
        '200': {description: Materials, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Material'}}}, required: [items]}}}}
        '400': {$ref: '#/components/responses/Problem'}
  /suppliers:
    get:
      tags: [Reference]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      parameters: [{$ref: '#/components/parameters/Active'}]
      responses:
        '200': {description: Suppliers, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Supplier'}}}, required: [items]}}}}
        '400': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Reference]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SupplierCreate'}}}}
      responses:
        '201': {description: Supplier, content: {application/json: {schema: {$ref: '#/components/schemas/Supplier'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /owner-policy:
    get:
      tags: [Reference]
      x-required-role: [OWNER]
      responses:
        '200': {description: Current policy, content: {application/json: {schema: {$ref: '#/components/schemas/OwnerPolicy'}}}}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Reference]
      x-required-role: [OWNER]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OwnerPolicyUpdate'}}}}
      responses:
        '200': {description: New immutable policy version, content: {application/json: {schema: {$ref: '#/components/schemas/OwnerPolicy'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /rfqs:
    get:
      tags: [Procurement]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {description: RFQ page, content: {application/json: {schema: {$ref: '#/components/schemas/RfqPage'}}}}
        '400': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Procurement]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RfqCreate'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Rfq'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /rfqs/{rfqId}:
    parameters: [{$ref: '#/components/parameters/RfqId'}]
    get:
      tags: [Procurement]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      responses:
        '200': {description: RFQ, content: {application/json: {schema: {$ref: '#/components/schemas/Rfq'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /rfqs/{rfqId}/completeness:
    parameters: [{$ref: '#/components/parameters/RfqId'}]
    get:
      tags: [Procurement]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      parameters: [{name: quoteRevisionId, in: query, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Completeness result, content: {application/json: {schema: {$ref: '#/components/schemas/Completeness'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /rfqs/{rfqId}/quotes:
    parameters: [{$ref: '#/components/parameters/RfqId'}]
    post:
      tags: [Quotes]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteCreate'}}}}
      responses:
        '201': {description: Received revision, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteRevision'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /quotes/{quoteId}/revisions/{revision}:
    parameters: [{$ref: '#/components/parameters/QuoteId'}, {$ref: '#/components/parameters/Revision'}]
    get:
      tags: [Quotes]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      responses:
        '200': {description: Quote revision, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteRevision'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /quotes/{quoteId}/revisions/{revision}/extract:
    parameters: [{$ref: '#/components/parameters/QuoteId'}, {$ref: '#/components/parameters/Revision'}]
    post:
      tags: [Quotes]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: false, content: {application/json: {schema: {type: object, properties: {locale: {type: string}}}}}}
      responses:
        '200': {description: Candidate fields, never automatically verified, content: {application/json: {schema: {$ref: '#/components/schemas/ExtractionResult'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /quotes/{quoteId}/revisions/{revision}/extraction:
    parameters: [{$ref: '#/components/parameters/QuoteId'}, {$ref: '#/components/parameters/Revision'}]
    get:
      tags: [Quotes]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      responses:
        '200': {description: Latest extraction, content: {application/json: {schema: {$ref: '#/components/schemas/ExtractionResult'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /quotes/{quoteId}/revisions/{revision}/fields:
    parameters: [{$ref: '#/components/parameters/QuoteId'}, {$ref: '#/components/parameters/Revision'}]
    put:
      tags: [Quotes]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteFieldCorrection'}}}}
      responses:
        '200': {description: New revision, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteRevision'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /quotes/{quoteId}/revisions/{revision}/clarifications:
    parameters: [{$ref: '#/components/parameters/QuoteId'}, {$ref: '#/components/parameters/Revision'}]
    get:
      tags: [Quotes]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      responses:
        '200': {description: Clarification list, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/ClarificationDraft'}}}, required: [items]}}}}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Quotes]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {expectedFields: {type: array, items: {type: string}, minItems: 1}}, required: [expectedFields]}}}}
      responses:
        '201': {description: Draft only; not sent, content: {application/json: {schema: {$ref: '#/components/schemas/ClarificationDraft'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
  /quotes/{quoteId}/revisions/{revision}/clarifications/{clarificationId}/response:
    parameters: [{$ref: '#/components/parameters/QuoteId'}, {$ref: '#/components/parameters/Revision'}, {$ref: '#/components/parameters/ClarificationId'}]
    post:
      tags: [Quotes]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {responseText: {type: string}, receivedAt: {type: string, format: date-time}, simulated: {type: boolean}}, required: [responseText, receivedAt, simulated]}}}}
      responses:
        '201': {description: New quote revision, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteRevision'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /rfqs/{rfqId}/evaluations:
    parameters: [{$ref: '#/components/parameters/RfqId'}]
    post:
      tags: [Evaluations]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EvaluationCreate'}}}}
      responses:
        '201': {description: Persisted evaluation, content: {application/json: {schema: {$ref: '#/components/schemas/Evaluation'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /evaluations/{evaluationId}:
    parameters: [{$ref: '#/components/parameters/EvaluationId'}]
    get:
      tags: [Evaluations]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      responses:
        '200': {description: Immutable evaluation, content: {application/json: {schema: {$ref: '#/components/schemas/Evaluation'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /evaluations/{evaluationId}/lines:
    parameters: [{$ref: '#/components/parameters/EvaluationId'}]
    get:
      tags: [Evaluations]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      responses:
        '200': {description: Persisted evaluation lines, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/EvaluationLine'}}}, required: [items]}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /rfqs/{rfqId}/comparison:
    parameters: [{$ref: '#/components/parameters/RfqId'}]
    get:
      tags: [Evaluations]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      parameters: [{name: evaluationId, in: query, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Comparison from persisted evaluation, content: {application/json: {schema: {$ref: '#/components/schemas/Comparison'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /evaluations/{evaluationId}/negotiation-drafts:
    parameters: [{$ref: '#/components/parameters/EvaluationId'}]
    post:
      tags: [Evaluations]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {quoteRevisionId: {type: string, format: uuid}, proposedUnitRate: {$ref: '#/components/schemas/Decimal'}, requestedTerms: {type: array, items: {type: string}}}, required: [quoteRevisionId]}}}}
      responses:
        '201': {description: Draft and applied policy limits, content: {application/json: {schema: {$ref: '#/components/schemas/NegotiationDraft'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
  /evaluations/{evaluationId}/award-proposals:
    parameters: [{$ref: '#/components/parameters/EvaluationId'}]
    post:
      tags: [Approvals]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AwardProposalCreate'}}}}
      responses:
        '201': {description: Pending award proposal, content: {application/json: {schema: {$ref: '#/components/schemas/Proposal'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /customer-enquiries:
    get:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [OPEN, COSTED, QUOTED, WON, LOST]}}
      responses:
        '200': {description: List of customer enquiries, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/CustomerEnquiryView'}}}, required: [items]}}}}
    post:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerEnquiryCreate'}}}}
      responses:
        '201': {description: Customer enquiry created, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerEnquiryView'}}}}
        '400': {$ref: '#/components/responses/Problem'}
  /customer-enquiries/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      responses:
        '200': {description: Customer enquiry details, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerEnquiryView'}}}}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerEnquiryUpdate'}}}}
      responses:
        '200': {description: Customer enquiry updated, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerEnquiryView'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /customer-enquiries/{id}/boms:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      responses:
        '200': {description: BOMs for enquiry, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/BomView'}}}, required: [items]}}}}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BomCreate'}}}}
      responses:
        '201': {description: BOM created, content: {application/json: {schema: {$ref: '#/components/schemas/BomView'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /boms/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      responses:
        '200': {description: BOM details with items, content: {application/json: {schema: {$ref: '#/components/schemas/BomView'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /boms/{id}/items:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BomItemCreate'}}}}
      responses:
        '201': {description: BOM item added, content: {application/json: {schema: {$ref: '#/components/schemas/BomItemView'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /boms/{id}/items/{itemId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BomItemUpdate'}}}}
      responses:
        '200': {description: BOM item updated, content: {application/json: {schema: {$ref: '#/components/schemas/BomItemView'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      responses:
        '204': {description: BOM item deleted}
        '404': {$ref: '#/components/responses/Problem'}
  /boms/{id}/costings:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      responses:
        '200': {description: Costing sheets for BOM, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/CostingSheetView'}}}, required: [items]}}}}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CostingRunRequest'}}}}
      responses:
        '201': {description: Costing calculated and persisted, content: {application/json: {schema: {$ref: '#/components/schemas/CostingSheetView'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /boms/{id}/simulate-costing:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: scrapPercentage, in: query, required: false, schema: {$ref: '#/components/schemas/Decimal'}}
      - {name: targetMarginPct, in: query, required: false, schema: {$ref: '#/components/schemas/Decimal'}}
    post:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      responses:
        '200': {description: Transient deterministic costing simulation, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /costing-sheets/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      responses:
        '200': {description: Costing sheet snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/CostingSheetView'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /customer-quotations:
    get:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      parameters:
        - {name: enquiryId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Customer quotations, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/CustomerQuotationView'}}}, required: [items]}}}}
    post:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerQuotationCreate'}}}}
      responses:
        '201': {description: Customer quotation generated, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerQuotationView'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /customer-quotations/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      responses:
        '200': {description: Customer quotation details, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerQuotationView'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /customer-quotations/{id}/submit-approval:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Approvals]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/QuotationApprovalSubmission'}}}}
      responses:
        '201': {description: Commercial proposal created for customer quotation, content: {application/json: {schema: {$ref: '#/components/schemas/Proposal'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /customer-enquiries/{id}/quotations:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Commercial]
      x-required-role: [OWNER, PROCUREMENT_OPERATOR, READ_ONLY_EVALUATOR]
      responses:
        '200': {description: Quotations for enquiry, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/CustomerQuotationView'}}}, required: [items]}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /enquiries:
    post:
      tags: [Profitability]
      x-required-role: [OWNER, QUOTATION_OPERATOR]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EnquiryCreate'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Enquiry'}}}}
        '400': {$ref: '#/components/responses/Problem'}
  /enquiries/{enquiryId}/cost-sheets:
    parameters: [{$ref: '#/components/parameters/EnquiryId'}]
    post:
      tags: [Profitability]
      x-required-role: [OWNER, QUOTATION_OPERATOR]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CostSheetCreate'}}}}
      responses:
        '201': {description: Cost sheet, content: {application/json: {schema: {$ref: '#/components/schemas/CostSheet'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /cost-sheets/{costSheetId}/simulate:
