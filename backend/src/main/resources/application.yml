spring:
  application:
    name: munim-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/munim}
    username: ${DATABASE_USER:munim}
    password: ${DATABASE_PASSWORD:munim-local}
  flyway:
    enabled: true
management:
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: ${MUNIM_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
        allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
        allowed-headers: "*"
        allow-credentials: true
server:
  port: ${PORT:8080}
munim:
  security:
    cors:
      allowed-origins: ${MUNIM_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  ai:
    provider: ${MUNIM_AI_PROVIDER:mock}
    model: ${MUNIM_AI_MODEL:gpt-4o-mini}
    prompt-version: ${MUNIM_AI_PROMPT_VERSION:PROMPT_v1.0}
    schema-version: ${MUNIM_AI_SCHEMA_VERSION:1.0}
    timeout-seconds: ${MUNIM_AI_TIMEOUT_SECONDS:5}
    api-key: ${MUNIM_AI_API_KEY:}
    base-url: ${MUNIM_AI_BASE_URL:https://api.openai.com/v1}
  ml:
    service-url: ${MUNIM_ML_SERVICE_URL:http://localhost:8000}
    internal-secret: ${INTERNAL_ML_SECRET:munim-internal-ml-secret-dev}
    connect-timeout-ms: ${MUNIM_ML_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${MUNIM_ML_READ_TIMEOUT_MS:2000}
    enabled: ${MUNIM_ML_ENABLED:true}
---
spring:
  config:
    activate:
      on-profile: postgres-test
  datasource:
    url: ${DATABASE_TEST_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/munim_test}
    username: ${DATABASE_USER:munim}
    password: ${DATABASE_PASSWORD:munim-local}
  flyway:
    enabled: true
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:munim;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
